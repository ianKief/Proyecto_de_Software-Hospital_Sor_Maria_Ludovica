<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Alimentación - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-white focus:text-blue-600 focus:font-bold focus:shadow-md">Saltar al contenido principal</a>

    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between py-4">
            <div class="flex items-center gap-2">
                <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                <strong class="text-lg text-gray-900">Hospital Sor María Ludovica</strong>
            </div>
            <nav aria-label="Navegación principal">
                <ul class="flex items-center gap-4">
                    <li><a href="{{ url_for('main.home') }}" class="text-gray-600 hover:text-gray-900 font-medium px-3 py-2 rounded-md transition-colors">Inicio</a></li>
                    {% if session.get('user') %}
                        <li><a href="{{ url_for('users.user_index') }}" class="text-gray-600 hover:text-gray-900 font-medium px-3 py-2 rounded-md transition-colors">Usuarios</a></li>
                        <li><a href="{{ url_for('auth.logout') }}" class="text-red-600 hover:text-red-800 font-medium px-3 py-2 rounded-md transition-colors">Cerrar Sesión ({{ session.get('user') }})</a></li>
                    {% else %}
                        <li><a href="{{ url_for('auth.login') }}" class="bg-blue-600 text-white hover:bg-blue-700 font-medium px-4 py-2 rounded-md transition-colors">Iniciar Sesión</a></li>
                    {% endif %}
                </ul>
            </nav>
        </div>
    </header>

    <div class="flex-grow flex flex-col">
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="container mx-auto px-4 py-6 text-center text-sm text-gray-500">
            <p>&copy; 2026 - Sistema de Alimentación</p>
        </div>
    </footer>
</body>
</html>
