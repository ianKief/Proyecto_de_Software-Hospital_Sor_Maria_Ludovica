{% extends "layout.html" %}

{% block content %}
<main id="main-content" class="container" tabindex="-1">
    <div style="max-width: 400px; margin: 0 auto; padding: var(--spacing-lg) 0;">
        <h1 class="text-center">Iniciar Sesión</h1>
        
        <!-- Contenedor accesible para notificaciones -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div role="alert" aria-live="polite" class="flash-messages">
              {% for category, message in messages %}
                <div style="padding: var(--spacing-sm); margin-bottom: var(--spacing-sm); border-radius: var(--radius); background-color: {% if category == 'error' %}#f8d7da{% else %}#d4edda{% endif %}; color: {% if category == 'error' %}#721c24{% else %}#155724{% endif %}; border: 1px solid {% if category == 'error' %}#f5c6cb{% else %}#c3e6cb{% endif %};">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}" style="display: flex; flex-direction: column; gap: var(--spacing-md); background: var(--color-bg); padding: var(--spacing-lg); border-radius: var(--radius); color: var(--color-text); border: 1px solid var(--color-border);">
            
            <div style="display: flex; flex-direction: column; gap: 0.25rem;">
                <label for="email" style="font-weight: 500;">Correo electrónico <span aria-hidden="true" style="color: #dc2626;">*</span></label>
                <input type="email" id="email" name="email" required aria-required="true" placeholder="ejemplo@hospital.com" 
                       style="padding: 0.75rem; border: 1px solid var(--color-border); border-radius: var(--radius); min-height: 44px; font-size: 1rem;">
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 0.25rem;">
                <label for="password" style="font-weight: 500;">Contraseña <span aria-hidden="true" style="color: #dc2626;">*</span></label>
                <input type="password" id="password" name="password" required aria-required="true" 
                       style="padding: 0.75rem; border: 1px solid var(--color-border); border-radius: var(--radius); min-height: 44px; font-size: 1rem;">
            </div>
            
            <button type="submit" class="btn" style="width: 100%; min-height: 44px; font-size: 1rem; margin-top: var(--spacing-sm);">Ingresar</button>
        </form>
    </div>
</main>
{% endblock %}
