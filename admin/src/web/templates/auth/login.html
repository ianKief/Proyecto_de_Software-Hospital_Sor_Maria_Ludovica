{% extends "layout.html" %}

{% block content %}
<main id="main-content" class="container" tabindex="-1">
    <div class="auth-wrapper">
        <h1 class="text-center">Iniciar Sesión</h1>
        
        <!-- Contenedor accesible para notificaciones -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div role="alert" aria-live="polite" class="flash-messages">
              {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}" class="form-auth">
            
            <div class="form-group">
                <label for="email" class="form-label">Correo electrónico <span aria-hidden="true" class="required-asterisk">*</span></label>
                <input type="email" id="email" name="email" required aria-required="true" placeholder="ejemplo@hospital.com" class="form-input">
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Contraseña <span aria-hidden="true" class="required-asterisk">*</span></label>
                <input type="password" id="password" name="password" required aria-required="true" class="form-input">
            </div>
            
            <button type="submit" class="btn w-full mt-4">Ingresar</button>
        </form>
    </div>
</main>
{% endblock %}
