{% extends "layout.html" %}

{% block content %}
<main id="main-content" class="container mx-auto px-4 py-8 flex-grow" tabindex="-1">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-0">Crear Nuevo Usuario</h1>
            <a href="{{ url_for('users.user_index') }}" class="text-blue-600 hover:text-blue-800 font-medium">&larr; Volver al listado</a>
        </div>

        <!-- Notificaciones -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div role="alert" aria-live="polite" class="flash-messages mb-6">
              {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <form method="POST" action="{{ url_for('users.user_new') }}" class="flex flex-col gap-5">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div class="form-group flex flex-col gap-1.5">
                        <label for="nombre" class="form-label block text-sm font-medium text-gray-700">Nombre <span aria-hidden="true" class="text-red-600 ml-1">*</span></label>
                        <input type="text" id="nombre" name="nombre" required aria-required="true" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2 border text-gray-900">
                    </div>

                    <div class="form-group flex flex-col gap-1.5">
                        <label for="apellido" class="form-label block text-sm font-medium text-gray-700">Apellido <span aria-hidden="true" class="text-red-600 ml-1">*</span></label>
                        <input type="text" id="apellido" name="apellido" required aria-required="true" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2 border text-gray-900">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div class="form-group flex flex-col gap-1.5">
                        <label for="email" class="form-label block text-sm font-medium text-gray-700">Correo electrónico <span aria-hidden="true" class="text-red-600 ml-1">*</span></label>
                        <input type="email" id="email" name="email" required aria-required="true" placeholder="ejemplo@hospital.com" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2 border text-gray-900">
                    </div>

                    <div class="form-group flex flex-col gap-1.5">
                        <label for="dni" class="form-label block text-sm font-medium text-gray-700">DNI <span aria-hidden="true" class="text-red-600 ml-1">*</span></label>
                        <input type="text" id="dni" name="dni" required aria-required="true" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2 border text-gray-900">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div class="form-group flex flex-col gap-1.5">
                        <label for="password" class="form-label block text-sm font-medium text-gray-700">Contraseña <span aria-hidden="true" class="text-red-600 ml-1">*</span></label>
                        <input type="password" id="password" name="password" required aria-required="true" minlength="6" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2 border text-gray-900">
                    </div>

                    <div class="form-group flex flex-col gap-1.5">
                        <label for="role_id" class="form-label block text-sm font-medium text-gray-700">Rol del sistema <span aria-hidden="true" class="text-red-600 ml-1">*</span></label>
                        <select id="role_id" name="role_id" required aria-required="true" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2 border text-gray-900 bg-white">
                            <option value="">-- Seleccione un rol --</option>
                            {% for role in roles %}
                                <option value="{{ role.id }}">{{ role.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group mt-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="activo" checked class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <span class="text-sm font-medium text-gray-700">Usuario activo en el sistema</span>
                    </label>
                </div>

                <div id="sector-container" class="form-group flex flex-col gap-1.5 mt-4" style="display: none;">
                    <label for="sector_id" class="form-label block text-sm font-medium text-gray-700">Sector <span aria-hidden="true" class="text-red-600 ml-1">*</span></label>
                    <select id="sector_id" name="sector_id" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2 border text-gray-900 bg-white">
                        <option value="">-- Seleccione un sector --</option>
                        {% for sector in sectors %}
                            <option value="{{ sector.id }}">{{ sector.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <script>
                    document.addEventListener("DOMContentLoaded", function() {
                        const roleSelect = document.getElementById("role_id");
                        const sectorContainer = document.getElementById("sector-container");
                        const sectorSelect = document.getElementById("sector_id");

                        function toggleSector() {
                            const selectedOption = roleSelect.options[roleSelect.selectedIndex];
                            // Verifica si el texto de la opción seleccionada es "Jefe de Servicio"
                            if (selectedOption && selectedOption.text === "Jefe de Servicio") {
                                sectorContainer.style.display = "block";
                                sectorSelect.required = true;
                                sectorSelect.setAttribute("aria-required", "true");
                            } else {
                                sectorContainer.style.display = "none";
                                sectorSelect.required = false;
                                sectorSelect.removeAttribute("aria-required");
                                sectorSelect.value = ""; // Limpiar el valor si se oculta
                            }
                        }

                        // Ejecutar al cargar la pagina por si queda seleccionado
                        toggleSector();
                        // Ejecutar cuando cambia el rol
                        roleSelect.addEventListener("change", toggleSector);
                    });
                </script>
                <div class="flex justify-end gap-3 mt-4 pt-4 border-t border-gray-200">
                    <a href="{{ url_for('users.user_index') }}" class="inline-flex items-center justify-center px-4 py-2 border text-sm font-medium rounded-md shadow-sm transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200 border-gray-300">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Crear Usuario</button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
