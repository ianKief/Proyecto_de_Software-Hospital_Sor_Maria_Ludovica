{% extends "layout.html" %}

{% block title %}Agregar Personal{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
  <div class="bg-white p-6 rounded-lg shadow border border-gray-200">
    <h2 class="text-xl font-bold text-gray-800 mb-6">Alta de Personal</h2>

    <form method="POST" action="{{ url_for('personnel.create') }}" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">DNI *</label>
        <input type="text" name="dni" value="{{ data.get('dni', '') }}" required class="mt-1 w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-sm" placeholder="Solo dígitos sin puntos">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Nombre *</label>
          <input type="text" name="nombre" value="{{ data.get('nombre', '') }}" required class="mt-1 w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Apellido *</label>
          <input type="text" name="apellido" value="{{ data.get('apellido', '') }}" required class="mt-1 w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-sm">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Tipo de Personal *</label>
        <select id="personnel_type_id" name="personnel_type_id" required class="mt-1 w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-sm">
          <option value="">Seleccione un tipo...</option>
          {% for t in tipos_personal %}
            <option value="{{ t.id }}" data-requiere-sector="{{ 'true' if t.requiere_sector else 'false' }}" {% if data.get('personnel_type_id') == t.id|string %}selected{% endif %}>
              {{ t.nombre }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div id="sector_container">
        <label class="block text-sm font-medium text-gray-700">Sector *</label>
        <select id="sector_id" name="sector_id" class="mt-1 w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-sm">
          <option value="">Seleccione un sector...</option>
          {% for s in sectores %}
            <option value="{{ s.id }}" {% if data.get('sector_id') == s.id|string %}selected{% endif %}>
              {{ s.nombre }}
            </option>
          {% endfor %}
        </select>
        <p class="text-xs text-gray-500 mt-1">Obligatorio únicamente para Personal Fijo.</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Tipo de Menú *</label>
        <select name="menu_type_id" required class="mt-1 w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-sm">
          <option value="">Seleccione un menú...</option>
          {% for m in tipos_menu %}
            <option value="{{ m.id }}" {% if data.get('menu_type_id') == m.id|string %}selected{% endif %}>
              {{ m.nombre }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="flex items-center pt-2">
        <input type="checkbox" name="activo" id="activo" value="true" {% if data.get('activo', 'true') == 'true' %}checked{% endif %} class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
        <label for="activo" class="ml-2 block text-sm text-gray-700">Activo</label>
      </div>

      <div class="flex justify-end space-x-3 pt-4 border-t">
        <a href="{{ url_for('personnel.index') }}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 px-4 rounded text-sm transition">Cancelar</a>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded text-sm transition font-medium">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script>
  const typeSelect = document.getElementById('personnel_type_id');
  const sectorContainer = document.getElementById('sector_container');
  const sectorSelect = document.getElementById('sector_id');

  function toggleSector() {
    const selectedOption = typeSelect.options[typeSelect.selectedIndex];
    const requiereSector = selectedOption ? selectedOption.getAttribute('data-requiere-sector') === 'true' : false;

    if (requiereSector) {
      sectorContainer.style.display = 'block';
      sectorSelect.setAttribute('required', 'required');
    } else {
      sectorContainer.style.display = 'none';
      sectorSelect.removeAttribute('required');
      sectorSelect.value = '';
    }
  }

  typeSelect.addEventListener('change', toggleSector);
  window.addEventListener('DOMContentLoaded', toggleSector);
</script>
{% endblock %}
