<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en mantenimiento - Sistema de Alimentación</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex items-center justify-center px-4">
    <main class="w-full max-w-lg bg-white border border-gray-200 rounded-lg shadow-sm p-6 sm:p-8 text-center">
        <h1 class="text-2xl font-bold mb-4">Sitio en mantenimiento</h1>
        <p class="text-gray-700 mb-6">{{ mensaje }}</p>
        {% if session.get('user') %}
            <a href="{{ url_for('auth.logout') }}" class="inline-block text-red-600 hover:text-red-800 font-medium px-4 py-2 rounded-md transition-colors">Cerrar sesión</a>
        {% else %}
            <a href="{{ url_for('auth.login') }}" class="inline-block bg-blue-600 text-white hover:bg-blue-700 font-medium px-4 py-2 rounded-md transition-colors">Iniciar sesión</a>
        {% endif %}
    </main>
</body>
</html>
